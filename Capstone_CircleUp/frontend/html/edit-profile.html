<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/edit-profile.css">
    <link rel="stylesheet" href="/static/css/create-activity.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="form-container">
        <div class="form-card">
            <div class="card-header">
                <h1><i class="fa-solid fa-pen" style="color: #f39c12;"></i> Edit Profile</h1>
                <p class="subtitle">Update Your Profile Details</p>
            </div>

            <!-- Status Message -->
            <div id="statusMessage" class="status-message">
                <i class="fa-solid fa-circle-check"></i>
                <span id="statusText">Profile updated successfully!</span>
            </div>

            <form id="editProfileForm" class="edit-profile-form">

                <div class="form-group">
                    <label><i class="fa-solid fa-user" style="color: #8b5cf6;"></i> User Name</label>
                    <input type="text" id="name" placeholder="Enter your full name" minlength="3" maxlength="50">
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-phone" style="color: #22c55e;"></i> Phone Number</label>
                    <input type="tel" id="phone_number" placeholder="Enter a 10 digit phone number" minlength="10" maxlength="10">
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-pen-to-square" style="color: #34495e;"></i> Bio</label>
                    <textarea id="bio" rows="5" placeholder="Tell us about yourself..."></textarea>
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-location-dot" style="color: #e74c3c;"></i> City</label>
                    <select id="city">
                        <option value="">Select your city</option>
                        <option value="Mumbai">Mumbai</option>
                        <option value="New Delhi">New Delhi</option>
                        <option value="Bengaluru">Bengaluru</option>
                        <option value="Indore">Indore</option>
                        <option value="California">California</option>
                        <option value="Albuquerque">Albuquerque</option>
                        <option value="New York">New York</option>
                        <option value="Scranton">Scranton</option>
                        <option value="Pune">Pune</option>
                        <option value="Patna">Patna</option>
                        <option value="Jaipur">Jaipur</option>
                        <option value="Lucknow">Lucknow</option>
                        <option value="Hyderabad">Hyderabad</option>
                    </select>
                </div>

                <button type="submit" class="submit-btn">
                    <i class="fa-solid fa-floppy-disk"></i>
                    Update Profile
                </button>

                <div class="back-link-wrapper">
                    <a href="/profile" class="btn-back" style="color: rgba(238, 238, 49, 0.774);">
                        <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Error Popup -->
    <div id="errorPopup" class="popup">
        <div class="popup-content">
            <span class="close-btn">&times;</span>
            <p id="popupMessage"></p>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/edit-profile.js"></script>
</body>
</html>
