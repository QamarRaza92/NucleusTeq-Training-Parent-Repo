<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Details</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/activity-detail.css">
</head>
<body>
<header>
    <div class="logo">
        <i class="fa-solid fa-users"></i>
        CircleUp
    </div>
    <div class="right">
        <button class="logout-btn"
        onclick="window.location.href='/browse-activities'">
            <i class="fa-solid fa-arrow-left"></i>
            Browse
        </button>
        <button class="logout-btn"
        onclick="window.location.href='/dashboard'">
            <i class="fa-solid fa-gauge"></i>
            Dashboard
        </button>
        <button class="logout-btn"
        onclick="window.location.href='/profile'">
            <i class="fa-solid fa-user"></i>
            Profile
        </button>
        <button class="logout-btn"
        onclick="logout()">
            <i class="fa-solid fa-right-from-bracket"></i>
            Logout
        </button>
    </div>
</header>

<div class="detail-container">
    <div class="detail-card">
        <div class="detail-header">
            <h1 id="activityTitle"></h1>
            <div>
                <span
                id="activityCategory"
                class="detail-category">
                </span>
                <span
                id="activityStatus"
                class="status-badge">
                </span>
            </div>
        </div>

        <div class="detail-meta-grid">
            <div class="meta-item">
                <i class="fa-solid fa-location-dot"></i>
                <span>
                    <strong>Location :</strong>
                    <span id="activityLocation"></span>
                </span>
            </div>

            <div class="meta-item">
                <i class="fa-solid fa-calendar"></i>
                <span>
                    <strong>Date :</strong>
                    <span id="activityDate"></span>
                </span>
            </div>

            <div class="meta-item">
                <i class="fa-solid fa-clock"></i>
                <span>
                    <strong>Time :</strong>
                    <span id="activityTime"></span>
                </span>
            </div>
            <div class="meta-item">
                <i class="fa-solid fa-users"></i>
                <span>
                    <strong>Capacity :</strong>
                    <span id="activitySeats"></span>
                </span>
            </div>

            <div class="meta-item">
                <i class="fa-solid fa-phone"></i>
                <span>
                    <strong>Organizer :</strong>
                    <span id="organizerPhone">
                        Hidden
                    </span>
                </span>
            </div>
        </div>
        <div
        id="activityDescription"
        class="detail-description">
        </div>
        <div
        id="actionButtons"
        class="detail-actions">
        </div>
    </div>
    <div id="requestsSection">
    </div>
</div>

<div id="errorPopup" class="popup">
    <div class="popup-content">
        <span class="close-btn">
            &times;
        </span>
        <p id="popupMessage"></p>
    </div>
</div>
<script src="/static/js/auth.js"></script>
<script src="/static/js/activity-detail.js"></script>

</body>
</html>
